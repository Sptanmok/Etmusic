<!DOCTYPE html>
<html>
<head>
<style>
.text {
    text-align: center; /* 让所有文本默认居中 */
    margin: 20px 0;
}
.player{
    justify-content: center;
    align-items: center;
}
.text h2{
	color: #555657;
	font-size: 1.5em;
}
.text p{
	color: #555657;
}
.text span {
    display: inline-block;
    background: linear-gradient(to right, #000000 var(--progress, 0%), #555657 var(--progress, 0%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: --progress 0.1s ease;
	white-space: normal;
}
.currently{
	scroll-margin-top: 50%;
}
.currently h2{
	transition: all ease-in-out 0.3s;
	font-size: 2em;
}
@keyframes lyric_restore {
    0% {
        color: #000;
        font-size: 2em;
    }
    100% {
        color: #555657;
        font-size: 1.5em;
    }
}
.ly_restore h2{
    animation: lyric_restore 0.3s forwards;
}


</style>
<meta charset="utf-8">
<title>demo</title>
</head>
<body>
    <div class="player">
	  <audio id="audio" src="Shouldn't Have To Be Like That - Fra Lippo Lippi · The Best Of.m4a" controls style="width:100%" lyricpath="./Shouldn't Have To Be Like That - Fra Lippo Lippi · The Best Of.json"></audio>
      <div>
      <div class="text" type="lyric" id="lyric"></div>
      </div>
      <p type="text" id="pairlyric"></p>
      <br />
    </div>
<script src="lplayer.js"></script>
</body>
</html>
